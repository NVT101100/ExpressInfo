name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main # Hoặc master tùy branch chính của bạn

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Cài đặt dependency & Build dự án
      - name: Install and Build
        run: npm ci && npm run build

      # 2. Deploy lên Firebase bằng Firebase CLI với FIREBASE_TOKEN
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project expressinfo-510914 --token "${{ secrets.FIREBASE_TOKEN }}"